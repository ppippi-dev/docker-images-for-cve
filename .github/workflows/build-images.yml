# Add each OSS as <name>/Dockerfile with an org.opencontainers.image.version label.
# Build contexts stay empty; no local files, configuration or reports are inputs.
# Selection:
# - Pull request: the recipes whose <name>/Dockerfile changed, or every recipe
#   when this workflow changed. Build, test and scan only; nothing is published.
# - Push to main: the recipes whose <name>/Dockerfile changed in that push
#   (before..after). A first push, a force-push or unavailable history selects
#   every recipe. A push that changes only this workflow selects nothing, so
#   change this workflow through a pull request (it verifies every recipe) or
#   a manual run on another branch.
# - Manual run: one recipe folder name, or all (default). Only a run on main
#   publishes; elsewhere it verifies without publishing.
# An empty selection skips the build jobs and the run ends green.
# Main builds, tests and scans each selected recipe, then publishes it as
# sha-<commit> and v<version label>.
# A published v<version label> tag is never re-pointed: if it already exists, the
# recipe is still verified but nothing is pushed. It is pushed last, so it exists
# only after every other tag was pushed. Raise the rN suffix of the version label
# to publish a rebuild. Never lower the label: a deleted label would be published
# again with other contents.
# Only the newest version of each image is kept. Once v<version label> is
# published and pulls anonymously (pushed by this run, or already published and
# checked anonymously), the main job deletes every other version of that package:
# older v<...> tags with their sha-<commit> tags and untagged manifests. It
# deletes nothing if v<version label> is an image index, the package listing does
# not show exactly one version with its digest, or another version was created
# after it. Consumers pin the digest and move to the new one, or copy the image
# into their own registry. The package owner can restore a deleted version
# within 30 days in the package settings.
# A push run refuses to publish or delete once main has advanced, and GitHub may
# replace a pending run; publish such a recipe with a manual run on main.
# A new package linked to this public repository may be public as soon as the
# job pushes it, so merging a recipe to main is its publication: judge the
# license conditions of the image contents before merging. The job
# still checks that the package is public and pulls the pushed digest
# anonymously; if a package is not public, set it Public and check the digest
# with Verify published image with Podman.
name: Build, verify and publish OSS images

on:
  push:
    branches: [main]
    paths: ['*/Dockerfile', '.github/workflows/build-images.yml']
  pull_request:
    paths: ['*/Dockerfile', '.github/workflows/build-images.yml']
  workflow_dispatch:
    inputs:
      image:
        description: 'OSS folder name, or all'
        required: false
        default: all
        type: string

permissions:
  contents: read

concurrency:
  # Manual requests cannot replace pending automatic main builds or each other.
  group: oss-images-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
      count: ${{ steps.images.outputs.count }}
    steps:
      # Official actions/checkout v7.0.1 tag resolved through GitHub's Git refs API.
      - &checkout
        name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Discover changed OSS Dockerfiles
        id: images
        env:
          REQUESTED_IMAGE: ${{ inputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          name = os.environ['GITHUB_EVENT_NAME']
          safe = re.compile(r'[a-z0-9]+(?:[a-z0-9-]*[a-z0-9])?\Z')
          folders = []
          for path in pathlib.Path('.').iterdir():
              recipe = path / 'Dockerfile'
              if not path.is_dir() or not recipe.is_file():
                  continue
              if path.is_symlink() or recipe.is_symlink() or not safe.fullmatch(path.name):
                  raise SystemExit('OSS Dockerfiles require real folders with lowercase kebab-case names')
              folders.append(path.name)
          folders.sort()
          if name == 'workflow_dispatch':
              requested = os.environ.get('REQUESTED_IMAGE') or 'all'
              if requested != 'all' and requested not in folders:
                  raise SystemExit('Requested image must be all or an existing OSS folder')
              selected = folders if requested == 'all' else [requested]
          elif name == 'push':
              # Only the recipes changed by this push. A first push (zero before),
              # a force-push or missing history cannot be compared: build all.
              # A push that changes only this workflow selects nothing.
              before, head = event.get('before') or '', os.environ['GITHUB_SHA']
              changed = None
              if (re.fullmatch(r'[0-9a-f]{40}', before) and before != '0' * 40
                      and not event.get('forced')):
                  if not re.fullmatch(r'[0-9a-f]{40}', head):
                      raise SystemExit('Unexpected commit identifier')
                  result = subprocess.run(['git', 'diff', '--name-only', '-z', before, head],
                                          check=False, capture_output=True)
                  if result.returncode == 0:
                      changed = set(result.stdout.decode().rstrip('\0').split('\0'))
              if changed is None:
                  selected = folders
              else:
                  selected = [folder for folder in folders if folder + '/Dockerfile' in changed]
          else:
              base, head = event['pull_request']['base']['sha'], event['pull_request']['head']['sha']
              changed = None
              if re.fullmatch(r'[0-9a-f]{40}', base) and base != '0' * 40:
                  if not re.fullmatch(r'[0-9a-f]{40}', head):
                      raise SystemExit('Unexpected commit identifier')
                  result = subprocess.run(['git', 'diff', '--name-only', '-z', base, head],
                                          check=False, capture_output=True)
                  if result.returncode == 0:
                      changed = set(result.stdout.decode().rstrip('\0').split('\0'))
              # Unavailable PR history and changes to CI itself check every image.
              if changed is None or '.github/workflows/build-images.yml' in changed:
                  selected = folders
              else:
                  selected = [folder for folder in folders if folder + '/Dockerfile' in changed]
          matrix = {'oss': selected}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix) + '\ncount=' + str(len(selected)) + '\n')
          print('Selected OSS images: ' + (', '.join(selected) or 'none'))
          if not selected:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('No recipe selected: nothing was built, checked or published.\n')
          PY

  verify-pr:
    name: Verify ${{ matrix.oss }} (no publishing)
    if: >-
      needs.discover.outputs.count != '0' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'))
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      OSS: ${{ matrix.oss }}
      LOCAL_IMAGE: ci-local/${{ matrix.oss }}:${{ github.sha }}
    steps:
      - *checkout
      - &disk
        name: Free runner disk for the large vLLM image
        if: matrix.oss == 'vllm'
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          # The ~10 GB (uncompressed) image needs about 25 GB while it is built and
          # exported, plus scanner and Podman copies. Hosted runners guarantee 14 GB;
          # remove preinstalled SDKs that these jobs never use.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /opt/microsoft /opt/google /usr/local/julia*
          docker image prune --all --force >/dev/null
          df -h /
          available_gb="$(df --output=avail -BG / | tail -1 | tr -dc 0-9)"
          if [ "$available_gb" -lt 35 ]; then
            echo "::error::Only ${available_gb} GB free on /; the vLLM build needs at least 35 GB"
            exit 1
          fi
      - &build
        name: Build linux/amd64 with an empty context
        shell: bash
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          set -euo pipefail
          [[ "$OSS" =~ ^[a-z0-9]+([a-z0-9-]*[a-z0-9])?$ ]]
          test ! -L "$OSS"
          test -f "$OSS/Dockerfile" && test ! -L "$OSS/Dockerfile"
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$LOCAL_IMAGE" - < "$OSS/Dockerfile"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$LOCAL_IMAGE")" = linux/amd64
          image_version="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$LOCAL_IMAGE")"
          [[ "$image_version" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]
          docker image inspect --format '{{.Id}}' "$LOCAL_IMAGE" > "$RUNNER_TEMP/validated-image-id"
      - &release_build_cache
        name: Release the vLLM build cache on this disposable runner
        if: matrix.oss == 'vllm'
        shell: bash
        run: |
          set -euo pipefail
          # The tagged image is kept; only intermediate build snapshots are removed.
          docker builder prune --all --force >/dev/null
          df -h /
      - &vllm_runtime
        name: Verify vLLM imports, CUDA wheels, CLI and non-root read-only start (no GPU)
        if: matrix.oss == 'vllm'
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "$LOCAL_IMAGE")" = 2000:0
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$LOCAL_IMAGE")" = '["vllm","serve"]'
          test "$(docker image inspect --format '{{json .Config.ExposedPorts}}' "$LOCAL_IMAGE")" = '{"8000/tcp":{}}'
          test "$(docker image inspect --format '{{.Config.WorkingDir}}' "$LOCAL_IMAGE")" = /vllm-workspace
          # No GPU on hosted runners: offline, non-root, read-only root filesystem with
          # writable tmpfs for /tmp and the cache home, as a hardened deployment would use.
          run=(docker run --rm -i --network none --read-only --cap-drop ALL --security-opt no-new-privileges
               --tmpfs /tmp:rw,exec,mode=1777 --tmpfs /home/vllm:rw,exec,uid=2000,gid=0,mode=0770)
          "${run[@]}" --entrypoint /opt/vllm/bin/python "$LOCAL_IMAGE" -I - <<'PYCODE'
          import ctypes, glob, importlib.metadata as metadata, importlib.util, os, pwd, shutil, subprocess, sysconfig
          from pathlib import Path
          assert (os.getuid(), os.getgid()) == (2000, 0) and pwd.getpwuid(2000).pw_name == 'vllm'
          assert os.environ['HOME'] == '/home/vllm'
          for path in ('/opt/vllm/probe', '/etc/probe'):
              try:
                  Path(path).write_text('x')
              except OSError:
                  pass
              else:
                  raise AssertionError('root filesystem is writable: ' + path)
          cache = Path.home() / '.cache/probe'
          cache.parent.mkdir(parents=True, exist_ok=True)
          cache.write_text('ok')
          assert metadata.version('vllm') == '0.34.0'
          import torch, triton, vllm
          from vllm.entrypoints.openai import api_server
          from vllm.entrypoints.cli import main
          assert vllm.__version__ == '0.34.0' and torch.version.cuda.startswith('13.')
          print('torch', torch.__version__, 'CUDA', torch.version.cuda, 'triton', triton.__version__)
          site = Path(sysconfig.get_paths()['purelib'])
          for name in ('libcudart.so.13', 'libcublas.so.13', 'libcublasLt.so.13', 'libcudnn.so.9', 'libnccl.so.2',
                       'libnvrtc.so.13', 'libnvJitLink.so.13', 'libcusparseLt.so.0', 'libcufft.so.12',
                       'libcurand.so.10', 'libcusolver.so.12', 'libcusparse.so.12', 'libnvshmem_host.so.3'):
              found = sorted(site.glob('nvidia/**/' + name))
              assert found, 'missing CUDA wheel library ' + name
          # The user-space runtime loads without a driver; libcuda comes from the host.
          ctypes.CDLL(str(sorted(site.glob('nvidia/**/libcudart.so.13'))[0]))
          assert not glob.glob('/usr/lib64/libcuda.so*') and not Path('/usr/local/cuda').exists()
          assert importlib.util.find_spec('pip') is None
          assert not any(shutil.which(tool) for tool in ('pip', 'pip3', 'pip3.12', 'uv', 'uvx', 'ffmpeg', 'apt-get'))
          # Triton compiles its CUDA launcher with the system C compiler at first use.
          driver = Path(triton.__file__).parent / 'backends/nvidia'
          subprocess.run(['gcc', '-O3', '-fPIC', '-c', str(driver / 'driver.c'), '-I', str(driver / 'include'),
                          '-I', sysconfig.get_paths()['include'], '-o', '/tmp/triton-driver.o'], check=True)
          assert Path('/tmp/triton-driver.o').stat().st_size > 0
          assert (site / 'vllm-0.34.0.dist-info/licenses/LICENSE').is_file()
          print('PASS vLLM/torch imports, CUDA wheel libraries, no pip/uv, Triton C launcher build, non-root read-only')
          PYCODE
          # Without a GPU, vLLM cannot infer the CUDA device while building its parser;
          # select the CPU platform only to exercise the real entrypoint and CLI flags.
          help_log="$RUNNER_TEMP/vllm-serve-help.log"
          if ! "${run[@]}" -e VLLM_TARGET_DEVICE=cpu "$LOCAL_IMAGE" --help=all > "$help_log" 2>&1; then
            cat "$help_log"
            exit 1
          fi
          for pattern in '^usage: vllm serve' '--port' '--served-model-name'; do
            if ! grep -q -e "$pattern" "$help_log"; then
              cat "$help_log"
              echo "::error::vllm serve --help=all output lacks $pattern"
              exit 1
            fi
          done
          echo 'PASS entrypoint vllm serve --help=all (no GPU, no network, read-only root)'
          # Any other UID and GID (as a deployment with runAsUser/runAsGroup sets) with its
          # own writable HOME: the working directory must be readable and the CLI must start.
          other=(docker run --rm -i --network none --read-only --cap-drop ALL --security-opt no-new-privileges
                 --user 65534:65534 -e HOME=/cache --tmpfs /tmp:rw,exec,mode=1777 --tmpfs /cache:rw,exec,mode=1777)
          "${other[@]}" --entrypoint /opt/vllm/bin/python "$LOCAL_IMAGE" -I - <<'PYCODE'
          import os
          from pathlib import Path
          assert (os.getuid(), os.getgid()) == (65534, 65534)
          assert os.getcwd() == '/vllm-workspace' and os.listdir('.') == []
          assert not os.access('/home/vllm', os.X_OK)
          probe = Path.home() / '.cache/probe'
          probe.parent.mkdir(parents=True, exist_ok=True)
          probe.write_text('ok')
          import torch, triton, vllm
          assert vllm.__version__ == '0.34.0'
          print('PASS imports and working directory as UID/GID 65534')
          PYCODE
          other_log="$RUNNER_TEMP/vllm-serve-help-other.log"
          if ! "${other[@]}" -e VLLM_TARGET_DEVICE=cpu "$LOCAL_IMAGE" --help=all > "$other_log" 2>&1 ||
             ! grep -q -e '^usage: vllm serve' "$other_log"; then
            cat "$other_log"
            echo "::error::vllm serve --help=all failed as UID/GID 65534"
            exit 1
          fi
          echo 'PASS entrypoint vllm serve --help=all as UID/GID 65534'
      - &postgres_runtime
        name: Verify PostgreSQL as uid 70 (read-only root) and as root with password logins
        if: matrix.oss == 'postgres'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$LOCAL_IMAGE")" = '["docker-entrypoint.sh"]'
          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$LOCAL_IMAGE")" = '["postgres"]'
          # These fresh random values are for this isolated disposable test only.
          app_password="$(openssl rand -hex 24)"
          root_password="$(openssl rand -hex 24)"
          wrong_password="$(openssl rand -hex 24)"
          echo "::add-mask::$app_password"
          echo "::add-mask::$root_password"
          trap 'docker rm -f -v ci-pg70 ci-pgroot >/dev/null 2>&1 || true; docker volume rm ci-pg70 ci-pgroot >/dev/null 2>&1 || true; docker network rm ci-pg >/dev/null 2>&1 || true' EXIT
          # No external network, host ports or real credentials.
          docker network create --internal ci-pg >/dev/null
          docker volume create ci-pg70 >/dev/null
          docker volume create ci-pgroot >/dev/null
          # As uid 70 the entrypoint initialises PGDATA in a subdirectory of a
          # group-writable volume.
          docker run --rm --user 0 --network none -v ci-pg70:/v --entrypoint sh "$LOCAL_IMAGE" -c 'chown 0:70 /v && chmod 2775 /v'
          run70() {
            docker run -d --name ci-pg70 --network ci-pg --user 70:70 --read-only --cap-drop ALL \
              --security-opt no-new-privileges --tmpfs /var/run/postgresql --tmpfs /tmp \
              -v ci-pg70:/var/lib/postgresql/data -e PGDATA=/var/lib/postgresql/data/pgdata \
              -e POSTGRES_USER=app -e POSTGRES_DB=app -e "POSTGRES_PASSWORD=$app_password" "$LOCAL_IMAGE" >/dev/null
          }
          # The temporary server of the first start listens on the socket only; wait for TCP.
          wait_ready() {
            for attempt in $(seq 1 60); do
              if docker exec "$1" pg_isready -h 127.0.0.1 -U "$2" -d "$2" >/dev/null 2>&1; then return 0; fi
              sleep 2
            done
            docker logs "$1"
            return 1
          }
          # Connections from inside the server container are trusted by pg_hba; a
          # second container on the network must pass scram-sha-256.
          client() {
            local host=$1 user=$2 password=$3
            shift 3
            docker run --rm --network ci-pg -e "PGPASSWORD=$password" --entrypoint psql "$LOCAL_IMAGE" \
              -v ON_ERROR_STOP=1 -qAt -h "$host" -U "$user" -d "$user" "$@"
          }
          run70
          wait_ready ci-pg70 app
          test "$(docker exec ci-pg70 stat -c %u /proc/1)" = 70
          test "$(client ci-pg70 app "$app_password" -c 'SELECT system_user')" = scram-sha-256:app
          if client ci-pg70 app "$wrong_password" -c 'SELECT 1' >/dev/null 2>&1; then
            echo '::error::A wrong password was accepted'
            exit 1
          fi
          client ci-pg70 app "$app_password" -c 'CREATE TABLE t(x int)' -c 'INSERT INTO t VALUES (1)'
          test "$(client ci-pg70 app "$app_password" -c "SELECT (xpath('/a/text()', xmlparse(document '<a>1</a>')))[1]::text")" = 1
          test "$(client ci-pg70 app "$app_password" -c "SELECT encode(sha256('abc'), 'hex')")" = ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
          docker stop ci-pg70 >/dev/null
          docker rm ci-pg70 >/dev/null
          run70
          wait_ready ci-pg70 app
          test "$(client ci-pg70 app "$app_password" -c 'SELECT count(*) FROM t')" = 1
          docker logs ci-pg70 2>&1 | grep -q 'Skipping initialization'
          # As root the unchanged entrypoint drops to postgres through gosu (su-exec).
          docker run -d --name ci-pgroot --network ci-pg -e "POSTGRES_PASSWORD=$root_password" \
            -v ci-pgroot:/var/lib/postgresql/data "$LOCAL_IMAGE" >/dev/null
          wait_ready ci-pgroot postgres
          test "$(docker exec ci-pgroot readlink /usr/local/bin/gosu)" = /sbin/su-exec
          test "$(docker exec ci-pgroot stat -c %U /proc/1)" = postgres
          test "$(docker exec ci-pgroot stat -c %U /var/lib/postgresql/data/PG_VERSION)" = postgres
          test "$(client ci-pgroot postgres "$root_password" -c 'SELECT system_user')" = scram-sha-256:postgres
          echo 'PASS uid 70 read-only and root starts, restart on the same volume, scram-sha-256 logins over a network'
      - &apisix_runtime
        name: Verify APISIX libraries and a non-root standalone proxy request
        if: matrix.oss == 'apisix'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "$LOCAL_IMAGE")" = 636:636
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$LOCAL_IMAGE")" = '["/docker-entrypoint.sh"]'
          # Every ELF file of the bundled runtime and of APISIX resolves its libraries.
          docker run --rm -i --network none --user 0 --entrypoint bash "$LOCAL_IMAGE" -s <<'SH'
          set -euo pipefail
          count=0 missing=0
          while IFS= read -r -d '' file; do
            [ "$(head -c 4 "$file" | od -An -tx1 | tr -d ' \n')" = 7f454c46 ] || continue
            count=$((count + 1))
            if ldd "$file" 2>&1 | grep 'not found'; then
              echo "Unresolved library in $file"
              missing=1
            fi
          done < <(find /usr/local/openresty /usr/local/apisix -type f -print0)
          test "$count" -gt 10
          test "$missing" = 0
          echo "PASS $count ELF files under /usr/local/openresty and /usr/local/apisix resolve every library"
          SH
          smoke_dir="$RUNNER_TEMP/apisix-smoke"
          mkdir -p "$smoke_dir"
          # Standalone data plane: routes come from apisix.yaml, no etcd, no Admin API.
          cat > "$smoke_dir/config.yaml" <<'YAML'
          deployment:
            role: data_plane
            role_data_plane:
              config_provider: yaml
          apisix:
            node_listen: 9080
            enable_admin: false
          YAML
          # /backend is a local dummy upstream (mocking plugin); /proxy forwards to it
          # over a real upstream connection. Standalone mode reads apisix.yaml only
          # up to its #END line.
          cat > "$smoke_dir/apisix.yaml" <<'YAML'
          routes:
            - id: backend
              uri: /backend
              plugins:
                mocking:
                  content_type: text/plain
                  response_status: 200
                  response_example: apisix-smoke-ok
            - id: proxy
              uri: /proxy
              upstream:
                type: roundrobin
                nodes:
                  "127.0.0.1:9080": 1
              plugins:
                proxy-rewrite:
                  uri: /backend
          #END
          YAML
          chmod 755 "$smoke_dir"
          chmod 644 "$smoke_dir"/*.yaml
          trap 'docker rm -f ci-apisix >/dev/null 2>&1 || true' EXIT
          # No network, host ports or credentials; non-root with all capabilities dropped.
          docker run -d --name ci-apisix --network none --user 636:636 --cap-drop ALL \
            --security-opt no-new-privileges -e APISIX_STAND_ALONE=true \
            --mount "type=bind,src=$smoke_dir/config.yaml,dst=/usr/local/apisix/conf/config.yaml,readonly" \
            --mount "type=bind,src=$smoke_dir/apisix.yaml,dst=/usr/local/apisix/conf/apisix.yaml,readonly" \
            "$LOCAL_IMAGE" >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec ci-apisix curl --max-time 5 -fsS http://127.0.0.1:9080/proxy >/dev/null 2>&1; then break; fi
            sleep 1
          done
          body="$(docker exec ci-apisix curl --max-time 5 -fsS http://127.0.0.1:9080/proxy)" || { docker logs ci-apisix; exit 1; }
          test "$body" = apisix-smoke-ok
          test "$(docker exec ci-apisix curl --max-time 5 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9080/none)" = 404
          test "$(docker exec ci-apisix sh -c 'stat -c %u /proc/[0-9]* 2>/dev/null' | sort -u)" = 636
          docker exec ci-apisix /usr/bin/apisix version
          if ! logs="$(docker logs ci-apisix 2>&1)"; then
            echo '::error::docker logs failed for the APISIX container'
            exit 1
          fi
          if grep -E '\[(emerg|alert|crit)\]' <<<"$logs"; then
            echo '::error::APISIX logged an emerg, alert or crit message'
            exit 1
          fi
          echo 'PASS standalone APISIX as uid 636 proxied one request to a local upstream'
      - &scanner
        name: Install checksum-pinned Trivy 0.76.1
        shell: bash
        run: |
          set -euo pipefail
          # SHA256 agrees with both the official release checksums file and
          # the GitHub release asset API digest for v0.76.1 (Linux-64bit).
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 3 --output "$RUNNER_TEMP/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          printf '%s  %s\n' c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0 \
            "$RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy-bin" trivy
          "$RUNNER_TEMP/trivy-bin/trivy" --version
      - &scan
        name: Scan all vulnerabilities and enforce CVSS v3 zero for every component
        shell: bash
        run: |
          set -euo pipefail
          # Scan every severity and package type. Exit 0 applies only to findings;
          # scanner/process errors still stop the job before the policy runs.
          "$RUNNER_TEMP/trivy-bin/trivy" image \
            --config /dev/null --cache-dir "$RUNNER_TEMP/trivy-cache" \
            --scanners vuln --pkg-types os,library \
            --ignorefile '' --ignore-unfixed=false \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 \
            --format json --output "$RUNNER_TEMP/trivy-results.json" \
            --skip-db-update=false --skip-java-db-update=false --timeout 30m \
            "$LOCAL_IMAGE"
          "$RUNNER_TEMP/trivy-bin/trivy" convert --format table "$RUNNER_TEMP/trivy-results.json"
          python3 - <<'PYCODE'
          import json
          import math
          import os
          from pathlib import Path

          # Apply the same CVSS v3 policy to every component, including language runtimes.
          # Use every provider's available v3.0/v3.1 base assessment; any positive score
          # blocks. Missing assessments are unknown, not zero. v2/v4 cannot replace v3.
          # Trivy omits numeric zero in JSON: a missing score is accepted only when a
          # complete valid v3 vector independently proves the base score is zero.
          BASE = {'AV': 'NALP', 'AC': 'LH', 'PR': 'NLH', 'UI': 'NR', 'S': 'UC',
                  'C': 'NLH', 'I': 'NLH', 'A': 'NLH'}
          OPTIONAL = {'E': 'XUPFH', 'RL': 'XOTWU', 'RC': 'XURC',
                      'CR': 'XLMH', 'IR': 'XLMH', 'AR': 'XLMH',
                      'MAV': 'XNALP', 'MAC': 'XLH', 'MPR': 'XNLH', 'MUI': 'XNR',
                      'MS': 'XUC', 'MC': 'XNLH', 'MI': 'XNLH', 'MA': 'XNLH'}


          def reject_constant(value):
              raise ValueError('Non-finite JSON number: ' + value)


          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('Duplicate JSON key: ' + key)
                  result[key] = value
              return result


          def assessment(finding):
              cvss = finding.get('CVSS')
              if not isinstance(cvss, dict) or not cvss:
                  return [], 'CVSS v3 assessment missing or malformed'
              scores, errors = [], []
              for provider, values in cvss.items():
                  if not isinstance(provider, str) or not provider or not isinstance(values, dict):
                      errors.append('Malformed CVSS provider')
                      continue
                  if 'V3Score' not in values and 'V3Vector' not in values:
                      continue
                  score, vector = values.get('V3Score'), values.get('V3Vector')
                  score_present = 'V3Score' in values
                  if score_present and (type(score) not in (int, float) or not math.isfinite(score) or not 0 <= score <= 10):
                      errors.append(provider + ': invalid v3 score')
                      continue
                  if not isinstance(vector, str) or not vector.startswith(('CVSS:3.0/', 'CVSS:3.1/')):
                      errors.append(provider + ': missing or invalid v3 vector')
                      continue
                  metrics, valid = {}, True
                  for component in vector.split('/')[1:]:
                      pair = component.split(':')
                      if len(pair) != 2:
                          valid = False
                          break
                      key, value = pair
                      if (key in metrics or key not in BASE | OPTIONAL or len(value) != 1
                              or value not in (BASE | OPTIONAL)[key]):
                          valid = False
                          break
                      metrics[key] = value
                  if not valid or not BASE.keys() <= metrics.keys():
                      errors.append(provider + ': malformed or incomplete v3 vector')
                      continue
                  # For CVSS v3 base scoring, impact is zero iff C, I and A are all N.
                  # This catches inconsistent zero scores without a new runtime dependency.
                  zero_impact = all(metrics[key] == 'N' for key in ('C', 'I', 'A'))
                  if not score_present:
                      if not zero_impact:
                          errors.append(provider + ': missing v3 score with nonzero impact')
                          continue
                      score = 0
                  scores.append({'provider': provider, 'score': score, 'vector': vector,
                                 'score_source': 'reported' if score_present else 'derived from zero-impact base vector (Trivy omitempty)'})
                  if score == 0 and not zero_impact:
                      errors.append(provider + ': zero score conflicts with impact metrics')
                  if score > 0:
                      errors.append(provider + ': CVSS v3 score exceeds zero')
              if not scores:
                  errors.append('No complete CVSS v3 assessment available')
              return scores, '; '.join(errors)


          def main():
              temp = Path(os.environ['RUNNER_TEMP'])
              report = json.loads((temp / 'trivy-results.json').read_text(),
                                  parse_constant=reject_constant, object_pairs_hook=unique_object)
              expected = (temp / 'validated-image-id').read_text().strip()
              assert expected.startswith('sha256:') and len(expected) == 71, 'Invalid validated image ID'
              assert report.get('SchemaVersion') == 2, 'Unexpected Trivy report schema'
              assert report.get('ArtifactType') == 'container_image', 'Not a container image scan'
              assert report.get('Metadata', {}).get('ImageID') == expected, 'Scan image differs from the validated image'
              results = report.get('Results')
              assert isinstance(results, list) and results, 'Missing scan results'
              zero, blocked = [], []
              for result in results:
                  assert isinstance(result, dict), 'Malformed scan target'
                  for field in ('Target', 'Class', 'Type'):
                      assert isinstance(result.get(field), str) and result[field], 'Incomplete scan target'
                  findings = result.get('Vulnerabilities')
                  if findings is None:
                      findings = []
                  assert isinstance(findings, list), 'Malformed vulnerability list'
                  for finding in findings:
                      assert isinstance(finding, dict), 'Malformed vulnerability'
                      for field in ('VulnerabilityID', 'PkgName', 'InstalledVersion', 'Severity'):
                          assert isinstance(finding.get(field), str) and finding[field], 'Incomplete vulnerability'
                      scores, reason = assessment(finding)
                      row = {'target': result['Target'], 'class': result['Class'], 'type': result['Type'],
                             'package': finding['PkgName'], 'installed': finding['InstalledVersion'],
                             'cve': finding['VulnerabilityID'], 'severity': finding['Severity'],
                             'cvss_v3': scores, 'reason': reason or 'All available CVSS v3 base assessments prove zero'}
                      (blocked if reason else zero).append(row)
                      print(('BLOCKED ' if reason else 'CVSS V3 ZERO ') + json.dumps(row))
              decision = {'policy': 'CVSS v3.0/v3.1 base zero; no runtime exceptions; unknown blocks',
                          'cvss_v3_zero_findings': zero, 'blocking_findings': blocked,
                          'image_id': expected, 'publication_gate': 'blocked' if blocked else 'passed'}
              (temp / 'vulnerability-policy-result.json').write_text(json.dumps(decision, indent=2) + '\n')

              def cell(value):
                  return str(value).replace('|', '\\|').replace('\r', ' ').replace('\n', ' ')

              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f'CVSS v3 policy: {len(zero)} verified zero-score findings, {len(blocked)} blocking findings.\n\n')
                  summary.write('All components are checked, including language runtimes. Missing/invalid v3 assessments block; '
                                'v2/v4 scores and scanner severity are not substituted for v3. '
                                'An omitted score is accepted only when a complete valid v3 base vector proves zero impact.\n\n')
                  if zero or blocked:
                      summary.write('| Decision | Package | Installed version | Vulnerability | CVSS v3 provider / score / vector | Reason |\n'
                                    '|---|---|---|---|---|---|\n')
                      for row in zero + blocked:
                          scores = '; '.join(f"{s['provider']}: {s['score']} [{s['score_source']}] ({s['vector']})" for s in row['cvss_v3']) or 'UNKNOWN'
                          summary.write('| ' + ' | '.join(cell(value) for value in
                              ('BLOCKED' if row in blocked else 'CVSS v3 = 0', row['package'], row['installed'],
                               row['cve'], scores, row['reason'])) + ' |\n')
                  summary.write('\nThis gate does not establish acceptance by the destination scanner.\n')
              if blocked:
                  raise SystemExit('CVSS v3 positive, unknown or invalid findings block publication')
              print('PASS CVSS v3 zero policy; no runtime exceptions; all scanner findings retained')


          if __name__ == '__main__':
              main()
          PYCODE
      - &identity
        name: Confirm the validated image was not replaced
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$LOCAL_IMAGE")" = "$(cat "$RUNNER_TEMP/validated-image-id")"

  publish-main:
    name: Verify and publish ${{ matrix.oss }}
    concurrency:
      group: package-${{ github.repository }}-${{ matrix.oss }}
      cancel-in-progress: false
    if: >-
      needs.discover.outputs.count != '0' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      OSS: ${{ matrix.oss }}
      LOCAL_IMAGE: ci-local/${{ matrix.oss }}:${{ github.sha }}
    steps:
      - *checkout
      - name: Check package visibility before the expensive build
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/check-package-visibility.py" <<'PYCODE'
          import json, os, sys, urllib.error, urllib.request
          owner, name = os.environ['REGISTRY_OWNER'], os.environ['OSS']
          url = f'https://api.github.com/users/{owner}/packages/container/{name}'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GHCR_TOKEN'],
              'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  package = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404 and sys.argv[1] == 'before':
                  print('New package: the push below creates it; its visibility is checked after the push.')
                  raise SystemExit(0)
              raise
          assert package['name'] == name and package['package_type'] == 'container'
          assert package['owner']['login'].lower() == owner.lower()
          if package['visibility'] != 'public':
              raise SystemExit('Package must be Public for anonymous pull. Set Public in GitHub Package settings, then use Verify published image with Podman; do not rebuild an already validated image.')
          print('Verified public package visibility.')
          PYCODE
          python3 "$RUNNER_TEMP/check-package-visibility.py" before
      - *disk
      - *build
      - *release_build_cache
      - *vllm_runtime
      - *postgres_runtime
      - *apisix_runtime
      - *scanner
      - *scan
      - *identity
      - name: Check whether this version is already published
        id: published
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          image_version="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$LOCAL_IMAGE")"
          [[ "$image_version" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,126}$ ]]
          cat > "$RUNNER_TEMP/check-published-version.py" <<'PYCODE'
          import base64, json, os, re, sys, urllib.error, urllib.parse, urllib.request
          # Prints "published" or "absent" for ghcr.io/<owner>/<recipe>:<tag>. Only a
          # definite "unknown" answer means absent; authentication errors, rate limits,
          # network errors and unexpected answers exit non-zero, so nothing is pushed.
          MEDIA_TYPES = ', '.join((
              'application/vnd.oci.image.index.v1+json', 'application/vnd.oci.image.manifest.v1+json',
              'application/vnd.docker.distribution.manifest.list.v2+json',
              'application/vnd.docker.distribution.manifest.v2+json'))

          def fetch(url, headers):
              # HTTP statuses are answers; transport errors propagate and fail the job.
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, response.headers, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.headers, error.read()

          def package_exists(owner, name, token):
              status, _, body = fetch(f'https://api.github.com/users/{owner}/packages/container/{name}', {
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              if status == 404:
                  return False
              if status != 200:
                  raise SystemExit(f'Packages API answered HTTP {status} for {name}; cannot tell whether it is published')
              package = json.loads(body)
              assert package['name'] == name and package['package_type'] == 'container'
              assert package['owner']['login'].lower() == owner.lower()
              return True

          def registry_digest(repository, tag, scope, credentials=None):
              # Returns the manifest digest, or None only for MANIFEST_UNKNOWN/NAME_UNKNOWN.
              headers = {}
              if credentials:
                  headers['Authorization'] = 'Basic ' + base64.b64encode(':'.join(credentials).encode()).decode()
              query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': f'repository:{repository}:{scope}'})
              status, _, body = fetch('https://ghcr.io/token?' + query, headers)
              if status != 200:
                  raise SystemExit(f'GHCR token request answered HTTP {status}: {body[:200]!r}')
              token = json.loads(body).get('token')
              if not isinstance(token, str) or not token:
                  raise SystemExit('GHCR token response has no token')
              status, answer, body = fetch(f'https://ghcr.io/v2/{repository}/manifests/{tag}', {
                  'Authorization': 'Bearer ' + token, 'Accept': MEDIA_TYPES})
              if status == 200:
                  digest = answer.get('Docker-Content-Digest', '')
                  if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                      raise SystemExit('GHCR returned a manifest without a valid digest')
                  return digest
              if status == 404:
                  try:
                      codes = {error['code'] for error in json.loads(body)['errors']}
                  except (ValueError, KeyError, TypeError):
                      codes = set()
                  if codes and codes <= {'MANIFEST_UNKNOWN', 'NAME_UNKNOWN'}:
                      return None
              raise SystemExit(f'GHCR manifest request answered HTTP {status}: {body[:200]!r}')

          def main():
              owner, name, tag = os.environ['REGISTRY_OWNER'], os.environ['OSS'], sys.argv[1]
              token, user = os.environ['GHCR_TOKEN'], os.environ['GHCR_USER']
              assert token and user and re.fullmatch(r'v[a-zA-Z0-9_.-]{1,127}', tag)
              exists = package_exists(owner, name, token)
              # Anonymous reads cannot tell a private package from a missing one. The job
              # token with the pull,push scope that docker push requests can read every
              # package this job can push to; a new package answers MANIFEST_UNKNOWN.
              digest = registry_digest(f'{owner.lower()}/{name}', tag, 'pull,push', (user, token))
              if digest and not exists:
                  raise SystemExit('Packages API reports no package, but GHCR has the tag; refusing to decide')
              if digest:
                  print(f'{name}:{tag} is already published as {digest}', file=sys.stderr)
                  print('published')
              else:
                  print(f'{name}:{tag} is not published' + ('' if exists else ' (new package)'), file=sys.stderr)
                  print('absent')

          if __name__ == '__main__':
              main()
          PYCODE
          state="$(python3 "$RUNNER_TEMP/check-published-version.py" "v$image_version")"
          [[ "$state" == published || "$state" == absent ]]
          printf 'state=%s\ntag=v%s\n' "$state" "$image_version" >> "$GITHUB_OUTPUT"
      - name: Record that this version is already published
        if: steps.published.outputs.state == 'published'
        env:
          FIXED_TAG: ${{ steps.published.outputs.tag }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Built, tested and scanned `%s`. `ghcr.io/%s/%s:%s` is already published and is never re-pointed, so nothing was pushed. To publish a rebuild, raise the rN suffix of org.opencontainers.image.version in `%s/Dockerfile`. A first publication that stopped at private visibility is checked with Verify published image with Podman.\n' \
            "$OSS" "${REGISTRY_OWNER,,}" "$OSS" "$FIXED_TAG" "$OSS" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Podman if the hosted runner does not provide it
        if: steps.published.outputs.state == 'absent'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends podman
          fi
          podman --version
      - name: Publish version tags and verify anonymous Podman pull
        id: publish
        if: steps.published.outputs.state == 'absent'
        env:
          FIXED_TAG: ${{ steps.published.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          # Serialize by OSS and refuse an older run after main has advanced.
          python3 - <<'PYCODE'
          import json, os, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/ref/heads/main'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GHCR_TOKEN'],
              'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(req, timeout=30) as response:
              current = json.load(response)['object']['sha']
          if current != os.environ['GITHUB_SHA']:
              raise SystemExit('Main advanced; refusing to publish an older revision over its tags')
          PYCODE
          registry_image="ghcr.io/${REGISTRY_OWNER,,}/$OSS"
          image_version="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$LOCAL_IMAGE")"
          [[ "$image_version" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,126}$ ]]
          fixed_tag="v$image_version"
          python3 "$RUNNER_TEMP/check-package-visibility.py" before
          # Never re-point a published version tag; recheck right before pushing.
          test "$fixed_tag" = "$FIXED_TAG"
          test "$(python3 "$RUNNER_TEMP/check-published-version.py" "$fixed_tag")" = absent
          image_id="$(cat "$RUNNER_TEMP/validated-image-id")"
          test "$(docker image inspect --format '{{.Id}}' "$LOCAL_IMAGE")" = "$image_id"
          export DOCKER_CONFIG="$RUNNER_TEMP/ghcr-auth"
          podman_auth="$RUNNER_TEMP/podman-auth.json"
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"; rm -f "$podman_auth"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          # The version tag goes last: if a push stops early, the version still reads
          # as absent and a re-run pushes the whole set again.
          tags=("sha-$GITHUB_SHA" "$fixed_tag")
          for tag in "${tags[@]}"; do
            docker tag "$image_id" "$registry_image:$tag"
            docker push "$registry_image:$tag"
          done
          expected_digest="$(docker image inspect "$registry_image:$fixed_tag" | python3 -c 'import json,sys; repo=sys.argv[1]; matches=[s.split("@",1)[1] for s in json.load(sys.stdin)[0]["RepoDigests"] if s.startswith(repo+"@")]; assert len(set(matches))==1; print(matches[0])' "$registry_image")"
          # Recorded before the visibility check: a package that is not public needs
          # this tag, digest and image ID for Verify published image with Podman after
          # it is set Public.
          printf 'Pushed `%s`: %s\n\nDigest: `%s`\n\nImage ID: `%s`\n\n' \
            "$registry_image" "${tags[*]}" "$expected_digest" "$image_id" >> "$GITHUB_STEP_SUMMARY"
          python3 "$RUNNER_TEMP/check-package-visibility.py" after
          # Podman has independent storage, so this checks a real registry pull.
          # A fresh, empty authfile proves consumers can pull without a login.
          umask 077
          printf '{"auths":{}}\n' > "$podman_auth"
          podman pull --authfile "$podman_auth" --arch amd64 "$registry_image:$fixed_tag"
          pulled_id="$(podman image inspect --format '{{.Id}}' "$registry_image:$fixed_tag")"
          test "${pulled_id#sha256:}" = "${image_id#sha256:}"
          test "$(podman image inspect --format '{{.Os}}/{{.Architecture}}' "$registry_image:$fixed_tag")" = linux/amd64
          digest="$(podman image inspect --format '{{.Digest}}' "$registry_image:$fixed_tag")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$digest" = "$expected_digest"
          printf 'Public package, verified by anonymous Podman pull: `%s:%s`\n\nDigest: `%s@%s`\n' \
            "$registry_image" "$fixed_tag" "$registry_image" "$digest" >> "$GITHUB_STEP_SUMMARY"
      # Only the newest version of a package is kept. This runs on main only, after
      # this job pushed v<version label> and pulled it anonymously, or found it
      # already published (then the version is checked anonymously here first).
      - name: Delete every other version of this package
        if: >-
          github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
          ((steps.published.outputs.state == 'absent' && steps.publish.outcome == 'success') ||
           steps.published.outputs.state == 'published')
        env:
          FIXED_TAG: ${{ steps.published.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_STATE: ${{ steps.published.outputs.state }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          registry_image="ghcr.io/${REGISTRY_OWNER,,}/$OSS"
          image_version="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$LOCAL_IMAGE")"
          test "v$image_version" = "$FIXED_TAG"
          pushed_digest=''
          if [ "$PUBLISHED_STATE" = absent ]; then
            # The digest the previous step pushed and pulled anonymously.
            pushed_digest="$(docker image inspect "$registry_image:$FIXED_TAG" | python3 -c 'import json,sys; repo=sys.argv[1]; matches=[s.split("@",1)[1] for s in json.load(sys.stdin)[0]["RepoDigests"] if s.startswith(repo+"@")]; assert len(set(matches))==1; print(matches[0])' "$registry_image")"
          fi
          cat > "$RUNNER_TEMP/prune-package.py" <<'PYCODE'
          import datetime, hashlib, json, os, re, sys, time, urllib.error, urllib.parse, urllib.request
          # Keeps exactly the version of ghcr.io/<owner>/<recipe> that v<label> points to
          # and deletes every other version (older v<...> and sha-<commit> tags and
          # untagged manifests) through the packages REST API. It deletes nothing unless
          # v<label> resolves anonymously to a single-platform manifest, the listing has
          # exactly one version with that digest and tag, and no other version was created
          # after it; any other answer fails.
          API = 'https://api.github.com'
          DIGEST = re.compile(r'sha256:[0-9a-f]{64}\Z')
          SINGLE = ('application/vnd.docker.distribution.manifest.v2+json',
                    'application/vnd.oci.image.manifest.v1+json')
          INDEX = ('application/vnd.oci.image.index.v1+json',
                   'application/vnd.docker.distribution.manifest.list.v2+json')
          MANUAL = ('The job token can delete versions only of a package whose Manage Actions access '
                    'gives this repository the Admin role (the default for a package this workflow '
                    'created). Give it that role in the package settings and re-run, or delete the '
                    'other versions by hand: package page, View and manage all versions, Delete version.')
          ATTEMPTS, PAUSE = 6, 10
          sleep = time.sleep

          def fetch(method, url, headers):
              # HTTP statuses are answers; transport errors propagate and fail the step.
              request = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, response.headers, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.headers, error.read()

          def api_headers(token):
              return {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28'}

          def message(body):
              try:
                  text = json.loads(body).get('message', '')
              except (ValueError, AttributeError):
                  text = body.decode(errors='replace')
              return ' '.join(str(text).split())[:300]

          def anonymous_manifest(repository, tag):
              # Without credentials, as a consumer pulls: proves the tag is public and
              # returns its manifest digest and media type.
              query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': f'repository:{repository}:pull'})
              status, _, body = fetch('GET', 'https://ghcr.io/token?' + query, {})
              if status != 200:
                  raise SystemExit(f'Anonymous GHCR token request answered HTTP {status}')
              token = json.loads(body).get('token')
              if not isinstance(token, str) or not token:
                  raise SystemExit('Anonymous GHCR token response has no token')
              status, headers, body = fetch('GET', f'https://ghcr.io/v2/{repository}/manifests/{tag}', {
                  'Authorization': 'Bearer ' + token, 'Accept': ', '.join(SINGLE + INDEX)})
              if status != 200:
                  raise SystemExit(f'Anonymous pull of {repository}:{tag} answered HTTP {status}')
              digest = headers.get('Docker-Content-Digest', '')
              media_type = (headers.get('Content-Type') or '').split(';')[0].strip()
              if not DIGEST.match(digest) or 'sha256:' + hashlib.sha256(body).hexdigest() != digest:
                  raise SystemExit('GHCR returned a manifest whose digest does not match')
              if json.loads(body).get('mediaType', media_type) != media_type:
                  raise SystemExit('GHCR returned a manifest with conflicting media types')
              if media_type in INDEX:
                  # The platform manifests of an index are listed as untagged versions.
                  raise SystemExit(f'{repository}:{tag} is an image index; refusing to delete versions, '
                                   'because its platform manifests are listed as untagged versions')
              if media_type not in SINGLE:
                  raise SystemExit(f'Unexpected manifest media type {media_type!r}')
              return digest

          def next_page(link, owner, name):
              # Follows rel="next" only to the versions listing of the same package.
              for part in (link or '').split(','):
                  if not part.strip():
                      continue
                  match = re.fullmatch(r'\s*<([^<>]+)>\s*;\s*rel="([a-z ]+)"\s*', part)
                  if not match:
                      raise SystemExit('Unexpected Link header in the versions listing')
                  if 'next' in match.group(2).split():
                      url = urllib.parse.urlsplit(match.group(1))
                      if (url.scheme, url.netloc) != ('https', 'api.github.com') or not re.fullmatch(
                              r'/(?:(?i:users/' + re.escape(owner) + r')|user/[0-9]+)/packages/container/'
                              + re.escape(name) + r'/versions', url.path):
                          raise SystemExit('Unexpected next page in the versions listing')
                      return match.group(1)
              return None

          def list_versions(owner, name, token):
              url = f'{API}/users/{owner}/packages/container/{name}/versions?per_page=100'
              versions, pages = [], 0
              while url:
                  pages += 1
                  if pages > 50:
                      raise SystemExit('More than 50 pages of versions; refusing to decide')
                  status, headers, body = fetch('GET', url, api_headers(token))
                  if status != 200:
                      hint = ' ' + MANUAL if status in (401, 403, 404) else ''
                      raise SystemExit(f'Listing versions answered HTTP {status}: {message(body)}.{hint}')
                  page = json.loads(body)
                  if not isinstance(page, list):
                      raise SystemExit('The versions listing is not a list')
                  versions.extend(page)
                  url = next_page(headers.get('Link'), owner, name)
              return versions

          def created(version):
              value = version.get('created_at')
              try:
                  moment = datetime.datetime.fromisoformat(value.replace('Z', '+00:00'))
              except (AttributeError, ValueError):
                  raise SystemExit(f"Version {version.get('id')} has no valid created_at")
              if moment.tzinfo is None:
                  raise SystemExit(f"Version {version.get('id')} has no valid created_at")
              return moment

          def select(versions, digest, tag):
              # Returns (current, others), or None while no version is both named by the
              # digest of v<label> and the only one carrying that tag.
              ids, names, tags = set(), set(), {}
              for version in versions:
                  if not isinstance(version, dict):
                      raise SystemExit('Malformed version in the listing')
                  vid, name = version.get('id'), version.get('name')
                  metadata = version.get('metadata')
                  if not isinstance(metadata, dict) or metadata.get('package_type') != 'container':
                      raise SystemExit('Malformed version in the listing')
                  container = metadata.get('container')
                  labels = container.get('tags') if isinstance(container, dict) else None
                  if (type(vid) is not int or vid <= 0 or not isinstance(name, str) or not DIGEST.match(name)
                          or not isinstance(labels, list)
                          or not all(isinstance(label, str) and label for label in labels)):
                      raise SystemExit('Malformed version in the listing')
                  if vid in ids or name in names:
                      raise SystemExit(f'The listing repeats version {vid} or digest {name}')
                  ids.add(vid)
                  names.add(name)
                  for label in labels:
                      if label in tags:
                          raise SystemExit(f'Tag {label} is listed on more than one version')
                      tags[label] = vid
                  created(version)
              current = [version for version in versions if version['name'] == digest]
              if len(current) != 1 or tags.get(tag) != current[0]['id']:
                  return None
              others = [version for version in versions if version is not current[0]]
              newer = [version for version in others if created(version) > created(current[0])]
              if newer:
                  # Only the newest version is kept: never delete one created after v<label>,
                  # as after a lowered label.
                  raise SystemExit(f"Version {newer[0]['id']} was created after {tag}; a newer version "
                                   'exists, so nothing was deleted')
              return current[0], others

          def main():
              tag, pushed = sys.argv[1], sys.argv[2]
              owner, name, token = os.environ['REGISTRY_OWNER'], os.environ['OSS'], os.environ['GHCR_TOKEN']
              if os.environ.get('GITHUB_REF') != 'refs/heads/main' or os.environ.get('GITHUB_EVENT_NAME') not in ('push', 'workflow_dispatch'):
                  raise SystemExit('Versions are deleted only by push and manual runs on main')
              if not (token and re.fullmatch(r'v[a-zA-Z0-9_.-]{1,127}', tag)
                      and re.fullmatch(r'[a-z0-9]+(?:[a-z0-9-]*[a-z0-9])?', name)
                      and re.fullmatch(r'[A-Za-z0-9-]+', owner) and (not pushed or DIGEST.match(pushed))):
                  raise SystemExit('Unexpected arguments')
              repository = f'{owner.lower()}/{name}'
              digest = anonymous_manifest(repository, tag)
              if pushed and digest != pushed:
                  raise SystemExit(f'{tag} resolves to {digest}, not to the pushed {pushed}')
              # A new version can take a moment to appear in the listing.
              for attempt in range(ATTEMPTS):
                  if attempt:
                      sleep(PAUSE)
                  selected = select(list_versions(owner, name, token), digest, tag)
                  if selected:
                      break
              else:
                  raise SystemExit(f'The listing has no single version {digest} tagged {tag}; nothing was deleted')
              current, others = selected
              status, _, body = fetch('GET', f"{API}/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/main",
                                      api_headers(token))
              if status != 200:
                  raise SystemExit(f'Reading the main ref answered HTTP {status}: {message(body)}; nothing was deleted')
              if json.loads(body)['object']['sha'] != os.environ['GITHUB_SHA']:
                  raise SystemExit('Main advanced; refusing to delete versions from an older revision')
              summary = open(os.environ['GITHUB_STEP_SUMMARY'], 'a')
              def row(action, version):
                  summary.write(f"| {action} | {version['id']} | {' '.join(version['metadata']['container']['tags']) or '(untagged)'} | `{version['name']}` |\n")
                  summary.flush()
              summary.write(f'\nVersions of `ghcr.io/{repository}`:\n\n| Action | Version ID | Tags | Digest |\n|---|---|---|---|\n')
              row('Kept', current)
              refused = []
              for version in others:
                  status, _, body = fetch('DELETE', f"{API}/users/{owner}/packages/container/{name}/versions/{version['id']}",
                                          api_headers(token))
                  if status == 204:
                      row('Deleted', version)
                      print(f"Deleted version {version['id']} ({version['name']})")
                      continue
                  text = message(body)
                  if status in (400, 409, 422) and 'download' in text.lower():
                      # GitHub keeps public versions with more than 5,000 downloads.
                      row(f'Refused by GitHub (HTTP {status}, {text})', version)
                      refused.append(version)
                      continue
                  row(f'Stopped (HTTP {status}, {text})', version)
                  raise SystemExit(f"Deleting version {version['id']} answered HTTP {status}: {text}. "
                                   'Nothing else was deleted. ' + (MANUAL if status in (401, 403, 404) else ''))
              if anonymous_manifest(repository, tag) != digest:
                  raise SystemExit(f'{tag} no longer resolves to {digest}')
              if refused:
                  raise SystemExit(f'GitHub refused to delete {len(refused)} version(s): it keeps public versions '
                                   'with more than 5,000 downloads; only GitHub Support can remove them. '
                                   f'{tag} is unchanged.')
              print(f'Kept only {tag} ({digest}); deleted {len(others)} other version(s)')

          if __name__ == '__main__':
              main()
          PYCODE
          python3 "$RUNNER_TEMP/prune-package.py" "$FIXED_TAG" "$pushed_digest"
