# Recheck an existing registry image without rebuilding or publishing it.
name: Verify published image with Podman

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'OSS package name (for example litellm)'
        required: true
        default: litellm
        type: string
      tag:
        description: 'Published tag (for example v1.106.6)'
        required: true
        type: string
      digest:
        description: 'Expected manifest digest from the validated build, sha256:...'
        required: true
        type: string
      config_id:
        description: 'Optional expected image configuration ID, sha256:...'
        required: false
        type: string
      visibility:
        description: 'Public verifies an anonymous pull; private uses the repository token'
        required: true
        default: public
        type: choice
        options: [public, private]

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PACKAGE: ${{ inputs.image }}
      IMAGE_TAG: ${{ inputs.tag }}
      EXPECTED_DIGEST: ${{ inputs.digest }}
      EXPECTED_CONFIG: ${{ inputs.config_id }}
      VISIBILITY: ${{ inputs.visibility }}
      REGISTRY_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PACKAGE" =~ ^[a-z0-9]+([a-z0-9-]*[a-z0-9])?$ ]]
          [[ "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ -z "$EXPECTED_CONFIG" || "$EXPECTED_CONFIG" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$VISIBILITY" == public || "$VISIBILITY" == private ]]
      - name: Install Podman if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends podman
          fi
          podman --version
      - name: Verify visibility and pull the existing image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          url = 'https://api.github.com/users/' + os.environ['REGISTRY_OWNER'] + '/packages/container/' + os.environ['PACKAGE']
          req = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GHCR_TOKEN'],
              'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(req, timeout=30) as response:
              package = json.load(response)
          assert package['name'] == os.environ['PACKAGE']
          assert package['owner']['login'].lower() == os.environ['REGISTRY_OWNER'].lower()
          assert package['package_type'] == 'container'
          actual = package['visibility']
          assert actual == os.environ['VISIBILITY'], f'Expected {os.environ["VISIBILITY"]}, got {actual}'
          print('Verified package visibility: ' + actual)
          PY
          image="ghcr.io/${REGISTRY_OWNER,,}/$PACKAGE:$IMAGE_TAG"
          authfile="$RUNNER_TEMP/podman-verify-auth.json"
          trap 'rm -f "$authfile"' EXIT
          umask 077
          printf '{"auths":{}}\n' > "$authfile"
          if [ "$VISIBILITY" = private ]; then
            printf '%s' "$GHCR_TOKEN" | podman login --authfile "$authfile" --username "$GHCR_USER" --password-stdin ghcr.io
          fi
          podman pull --authfile "$authfile" --arch amd64 "$image"
          actual_digest="$(podman image inspect --format '{{.Digest}}' "$image")"
          actual_id="$(podman image inspect --format '{{.Id}}' "$image")"
          test "$actual_digest" = "$EXPECTED_DIGEST"
          test "$(podman image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/amd64
          if [ -n "$EXPECTED_CONFIG" ]; then
            test "${actual_id#sha256:}" = "${EXPECTED_CONFIG#sha256:}"
          fi
          printf 'Verified existing image using Podman (%s): `%s`\n\nManifest: `%s`\n\nConfiguration: `%s`\n\nNo rebuild or registry write was performed.\n' \
            "$VISIBILITY" "$image" "$actual_digest" "$actual_id" >> "$GITHUB_STEP_SUMMARY"
